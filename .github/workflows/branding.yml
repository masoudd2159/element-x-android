name: Brand asset regression tests
on:
  pull_request:
  push:
    branches: [custom/develop]
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    container: node:24.12.0-bookworm-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: npm ci --prefix tools/branding --ignore-scripts --no-audit --no-fund
      - run: node --test tools/branding/generate-icons.test.cjs
      - run: node tools/branding/verify-source.cjs .
  hoopoe-foss:
    needs: icons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install managed tooling and validate enrolled artwork
        run: ./gradlew :app:installBrandingTools :app:validateAllBrandArtwork --stacktrace
      - name: Verify generator integration and incremental inputs
        run: python3 tools/branding/test-gradle-integration.py
      - name: Build Hoopoe FOSS Debug and verify every APK
        run: ./gradlew :app:assembleApHoopoeDebug --stacktrace
      - name: Test FOSS services, login and OAuth
        run: >-
          ./gradlew :features:enterprise:impl-foss:testDebugUnitTest :features:login:impl:testDebugUnitTest
          :libraries:matrix:impl:testDebugUnitTest --tests '*OAuthConfigurationProviderTest*' --stacktrace
      - name: Check branding and FOSS Kotlin style
        run: >-
          ./gradlew :app:ktlintCheck :features:enterprise:impl-foss:ktlintCheck :features:login:impl:ktlintCheck
          :libraries:designsystem:ktlintCheck :libraries:matrix:api:ktlintCheck :libraries:matrix:impl:ktlintCheck --stacktrace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: hoopoe-foss-debug
          path: app/build/outputs/apk/apHoopoe/debug/*.apk
